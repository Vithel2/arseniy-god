name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unpack www.zip
        run: |
          mkdir -p www
          unzip -o www.zip -d www
          ls www | head

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Cordova
        run: npm install -g cordova@12

      - name: Add Android platform
        run: cordova platform add android@13 --no-telemetry

      - name: Build release APK
        run: cordova build android --release --no-telemetry

      - name: Collect release APK
        run: |
          mkdir -p out

          echo "All APK files:"
          find platforms/android -type f -name "*.apk" -print

          APK_PATH="$(find platforms/android -type f -name "*release*.apk" | head -n 1)"

          if [ -z "$APK_PATH" ]; then
            echo "Release APK not found. Trying any APK..."
            APK_PATH="$(find platforms/android -type f -name "*.apk" | head -n 1)"
          fi

          if [ -z "$APK_PATH" ]; then
            echo "No APK produced. Build probably failed earlier."
            exit 1
          fi

          echo "Using APK: $APK_PATH"
          cp "$APK_PATH" out/ArseniyGod-release.apk
          ls -la out

      - uses: actions/upload-artifact@v4
        with:
          name: ArseniyGod-release-APK
          path: out/ArseniyGod-release.apk
