name: Build APK (debug signing)

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unpack www.zip
        run: |
          mkdir -p www
          unzip -o www.zip -d www

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Cordova
        run: npm install -g cordova@12

      - name: Add Android platform
        run: cordova platform add android@13 --no-telemetry

      # 1) Проверяем, что base64 вообще декодится в файл
      - name: Decode keystore (from secret)
        run: |
          set -e
          printf '%s' "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > release.jks
          echo "Decoded release.jks:"
          ls -lh release.jks || true
          echo "First bytes (should NOT be empty):"
          head -c 16 release.jks | xxd || true

      # 2) Проверяем пароль хранилища (KEYSTORE_PASSWORD)
      - name: Verify keystore password
        run: |
          set -e
          echo "Verifying keystore with KEYSTORE_PASSWORD..."
          keytool -list -keystore release.jks -storepass "${{ secrets.KEYSTORE_PASSWORD }}" >/dev/null
          echo "OK: KEYSTORE_BASE64 + KEYSTORE_PASSWORD are valid"

      # 3) Проверяем, что alias существует (KEY_ALIAS)
      - name: Verify alias exists
        run: |
          set -e
          echo "Checking alias '${{ secrets.KEY_ALIAS }}'..."
          keytool -list -keystore release.jks -storepass "${{ secrets.KEYSTORE_PASSWORD }}" | grep -i "${{ secrets.KEY_ALIAS }}" >/dev/null
          echo "OK: KEY_ALIAS exists in keystore"

      # 4) Пробуем подписанную release сборку (проверяет KEY_PASSWORD на практике)
      - name: Build signed release APK
        run: >
          cordova build android --release --no-telemetry -- --packageType=apk
          --keystore=release.jks
          --storePassword=${{ secrets.KEYSTORE_PASSWORD }}
          --alias=${{ secrets.KEY_ALIAS }}
          --password=${{ secrets.KEY_PASSWORD }}

      - name: Collect release APK
        run: |
          set -e
          mkdir -p out
          echo "Searching for release APK..."
          find platforms/android -type f -name "*.apk" -print || true
          APK_PATH="$(find platforms/android -type f -name "*release*.apk" | head -n 1)"
          if [ -z "$APK_PATH" ]; then
            echo "ERROR: No release APK found. Look at the build logs above."
            exit 1
          fi
          echo "Using APK: $APK_PATH"
          cp "$APK_PATH" out/ArseniyGod-release.apk
          ls -la out

      - uses: actions/upload-artifact@v4
        with:
          name: ArseniyGod-release-APK
          path: out/ArseniyGod-release.apk
