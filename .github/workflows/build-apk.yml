name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unpack www.zip
        run: |
          mkdir -p www
          unzip -o www.zip -d www

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Cordova
        run: npm install -g cordova@12

      - name: Add Android platform
        run: cordova platform add android@13 --no-telemetry

      - name: Decode keystore
        run: |
          printf '%s' "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > release.jks
          ls -la release.jks

      - name: Verify keystore
        run: |
          keytool -list -keystore release.jks -storepass "${{ secrets.KEYSTORE_PASSWORD }}"

      - name: Build signed release APK
        run: >
          cordova build android --release --no-telemetry -- --packageType=apk
          --keystore=release.jks
          --storePassword=${{ secrets.KEYSTORE_PASSWORD }}
          --alias=${{ secrets.KEY_ALIAS }}
          --password=${{ secrets.KEY_PASSWORD }}

      - name: Collect release APK
        run: |
          mkdir -p out
          APK_PATH="$(find platforms/android -type f -name "*release*.apk" | head -n 1)"
          test -n "$APK_PATH"
          cp "$APK_PATH" out/ArseniyGod-release.apk
          ls -la out

      - uses: actions/upload-artifact@v4
        with:
          name: ArseniyGod-release-APK
          path: out/ArseniyGod-release.apk
