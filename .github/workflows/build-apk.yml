name: Build APK
​
on:
  push:
  workflow_dispatch:
​
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
​
      - name: Unpack www.zip
        run: |
          mkdir -p www
          unzip -o www.zip -d www
          ls www | head
​
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
​
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
​
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
​
      - name: Add Maven mirrors (fix 403)
        run: |
          mkdir -p ~/.gradle
          cat > ~/.gradle/init.gradle <<'EOF'
          allprojects {
              buildscript {
                  repositories {
                      maven { url 'https://maven.google.com' }
                      maven { url 'https://repo1.maven.org/maven2' }
                      maven { url 'https://plugins.gradle.org/m2' }
                      maven { url 'https://jitpack.io' }
                      mavenCentral()
                      google()
                  }
              }
              repositories {
                  maven { url 'https://maven.google.com' }
                  maven { url 'https://repo1.maven.org/maven2' }
                  maven { url 'https://plugins.gradle.org/m2' }
                  maven { url 'https://jitpack.io' }
                  mavenCentral()
                  google()
              }
          }
          EOF
          cat > ~/.gradle/gradle.properties <<'EOF'
          org.gradle.daemon=false
          org.gradle.parallel=true
          org.gradle.jvmargs=-Xmx3g
          systemProp.http.keepAlive=false
          EOF
          echo "init.gradle ready"
​
      - name: Install Cordova
        run: npm install -g cordova@12
​
      - name: Add Android platform
        run: cordova platform add android@13 --no-telemetry
​
      - name: Build debug APK
        run: |
          cordova build android --no-telemetry || {
            echo "::warning::First build failed, retrying in 20s"
            sleep 20
            cordova build android --no-telemetry
          }
​
      - name: Collect APK
        run: |
          mkdir -p out
          find platforms/android -name "*.apk" -exec cp {} out/ArseniyGod.apk \;
          ls -la out
​
      - uses: actions/upload-artifact@v4
        with:
          name: ArseniyGod-APK
          path: out/ArseniyGod.apk
