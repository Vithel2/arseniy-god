name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unpack www.zip
        run: |
          mkdir -p www
          unzip -o www.zip -d www
          ls www | head

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Cordova
        run: npm install -g cordova@12

      - name: Add Android platform
        run: cordova platform add android@13 --no-telemetry

      # ВАЖНО: форсим именно APK (а не AAB)
      - name: Build release APK
        run: |
          cordova build android --release --no-telemetry -- --packageType=apk

      - name: Show Android outputs (debug)
        run: |
          echo "platforms/android tree (top):"
          ls -la platforms || true
          ls -la platforms/android || true
          echo "outputs folder:"
          find platforms/android -maxdepth 6 -type d -name outputs -print || true
          echo "APK files:"
          find platforms/android -type f -name "*.apk" -print || true
          echo "AAB files:"
          find platforms/android -type f -name "*.aab" -print || true

      - name: Collect release artifact
        run: |
          mkdir -p out

          APK_PATH="$(find platforms/android -type f -name "*release*.apk" | head -n 1)"
          if [ -n "$APK_PATH" ]; then
            echo "Using APK: $APK_PATH"
            cp "$APK_PATH" out/ArseniyGod-release.apk
            ls -la out
            exit 0
          fi

          AAB_PATH="$(find platforms/android -type f -name "*release*.aab" | head -n 1)"
          if [ -n "$AAB_PATH" ]; then
            echo "APK not found, but AAB found: $AAB_PATH"
            cp "$AAB_PATH" out/ArseniyGod-release.aab
            ls -la out
            exit 0
          fi

          echo "No APK/AAB produced. Open 'Build release APK' logs выше — там причина."
          exit 1

      - uses: actions/upload-artifact@v4
        with:
          name: ArseniyGod-release
          path: out/*
