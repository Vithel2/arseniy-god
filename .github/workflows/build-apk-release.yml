name: Build APK (release)

on:
  push:
  workflow_dispatch:

concurrency:
  group: apk-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unpack www.zip (python, cyrillic-safe)
        run: |
          rm -rf www
          python3 -c "import zipfile; zipfile.ZipFile('www.zip').extractall('www')"
          test -f www/index.html || (echo "ERROR: www/index.html missing after unpack" && exit 1)
          echo "www/ top entries:"; ls www
          du -sh www

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Setup Android SDK (manual, pinned)
        run: |
          set -e
          sudo apt-get update -qq
          sudo apt-get install -y -qq wget unzip
          export ANDROID_SDK_ROOT=$HOME/android-sdk
          mkdir -p "$ANDROID_SDK_ROOT/cmdline-tools"
          cd "$ANDROID_SDK_ROOT"
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -O cmdtools.zip
          unzip -q cmdtools.zip -d cmdline-tools
          mv cmdline-tools/cmdline-tools cmdline-tools/latest
          export PATH="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin:$PATH"
          yes | sdkmanager --licenses > /dev/null
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> $GITHUB_ENV
          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> $GITHUB_ENV
          echo "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin" >> $GITHUB_PATH
          echo "$ANDROID_SDK_ROOT/platform-tools" >> $GITHUB_PATH
          sdkmanager --list_installed

      - name: Install Cordova
        run: npm install -g cordova@12

      - name: Add Android platform
        run: cordova platform add android@13 --no-telemetry

      - name: Verify Android notification plugin
        run: |
          if ! cordova plugin list | grep -q '^cordova-plugin-local-notification '; then
            cordova plugin add cordova-plugin-local-notification@1.2.3 --no-save --no-telemetry
          fi
          cordova prepare android --no-telemetry
          cordova plugin list | grep '^cordova-plugin-local-notification '
          grep -q 'cordova-plugin-local-notification' platforms/android/app/src/main/assets/www/cordova_plugins.js
          grep -q 'android.permission.POST_NOTIFICATIONS' platforms/android/app/src/main/AndroidManifest.xml
          grep -q 'src="cordova.js"' platforms/android/app/src/main/assets/www/index.html

      - name: Check signing configuration
        id: signing
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -eu
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$KEYSTORE_PASSWORD" ] || [ -z "$KEY_ALIAS" ] || [ -z "$KEY_PASSWORD" ]; then
            echo "Signing secrets are unavailable; building a debug APK for testing."
            echo "release=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "release=true" >> "$GITHUB_OUTPUT"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > release.jks
          keytool -list -keystore release.jks -storepass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS" >/dev/null
          echo "STOREPASS=$KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
          echo "KEYALIAS=$KEY_ALIAS" >> "$GITHUB_ENV"
          echo "KEYPASS=$KEY_PASSWORD" >> "$GITHUB_ENV"

      - name: Build signed release APK
        if: steps.signing.outputs.release == 'true'
        run: >
          cordova build android --release --no-telemetry -- --packageType=apk
          --keystore=release.jks
          --storePassword=${{ env.STOREPASS }}
          --alias=${{ env.KEYALIAS }}
          --password=${{ env.KEYPASS }}

      - name: Build debug APK for testing
        if: steps.signing.outputs.release != 'true'
        run: cordova build android --debug --no-telemetry -- --packageType=apk

      - name: Collect APK
        run: |
          set -eu
          mkdir -p out
          if [ "${{ steps.signing.outputs.release }}" = "true" ]; then
            APK_PATH="$(find platforms/android -type f -name '*release*.apk' | head -n 1)"
            APK_NAME="ArseniyGod-release.apk"
          else
            APK_PATH="$(find platforms/android -type f -name '*debug*.apk' | head -n 1)"
            APK_NAME="ArseniyGod-debug-test.apk"
          fi
          if [ -z "$APK_PATH" ]; then echo "ERROR: APK not found"; exit 1; fi
          cp "$APK_PATH" "out/$APK_NAME"
          ls -la out

      - uses: actions/upload-artifact@v4
        with:
          name: ArseniyGod-APK
          path: out/
