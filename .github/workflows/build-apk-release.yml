name: Build APK (release)

on:
  push:
  workflow_dispatch:

concurrency:
  group: apk-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unpack www.zip (python, cyrillic-safe)
        run: |
          rm -rf www
          python3 -c "import zipfile; zipfile.ZipFile('www.zip').extractall('www')"
          test -f www/index.html || (echo "ERROR: www/index.html missing after unpack" && exit 1)
          echo "www/ top entries:"; ls www
          du -sh www

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Setup Android SDK (manual, pinned)
        run: |
          set -e
          sudo apt-get update -qq
          sudo apt-get install -y -qq wget unzip
          export ANDROID_SDK_ROOT=$HOME/android-sdk
          mkdir -p "$ANDROID_SDK_ROOT/cmdline-tools"
          cd "$ANDROID_SDK_ROOT"
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -O cmdtools.zip
          unzip -q cmdtools.zip -d cmdline-tools
          mv cmdline-tools/cmdline-tools cmdline-tools/latest
          export PATH="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin:$PATH"
          yes | sdkmanager --licenses > /dev/null
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> $GITHUB_ENV
          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> $GITHUB_ENV
          echo "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin" >> $GITHUB_PATH
          echo "$ANDROID_SDK_ROOT/platform-tools" >> $GITHUB_PATH
          sdkmanager --list_installed

      - name: Install Cordova
        run: npm install -g cordova@12

      - name: Add Android platform
        run: cordova platform add android@13 --no-telemetry

      - name: Prepare keystore (secrets or fresh + warning)
        run: |
          set -e
          if [ -n "${{ secrets.KEYSTORE_BASE64 }}" ]; then
            printf '%s' "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > release.jks
            keytool -list -keystore release.jks -storepass "${{ secrets.KEYSTORE_PASSWORD }}" >/dev/null
            echo "Using keystore from secrets (verified)."
            echo "STOREPASS=${{ secrets.KEYSTORE_PASSWORD }}" >> $GITHUB_ENV
            echo "KEYALIAS=${{ secrets.KEY_ALIAS }}" >> $GITHUB_ENV
            echo "KEYPASS=${{ secrets.KEY_PASSWORD }}" >> $GITHUB_ENV
          else
            echo "WARNING: no keystore secrets found - generating a FRESH key."
            echo "WARNING: this APK will NOT update over the old one, reinstall will be needed."
            echo "WARNING: save GENERATED-release.jks into secrets after this build!"
            keytool -genkeypair -keystore release.jks -alias arseniygod -keyalg RSA -keysize 2048 -validity 10000 -storepass android -keypass android -dname "CN=Vithel"
            keytool -list -keystore release.jks -storepass android >/dev/null
            echo "STOREPASS=android" >> $GITHUB_ENV
            echo "KEYALIAS=arseniygod" >> $GITHUB_ENV
            echo "KEYPASS=android" >> $GITHUB_ENV
            echo "GENERATED_KEYSTORE=1" >> $GITHUB_ENV
          fi
          ls -lh release.jks

      - name: Build signed release APK
        run: >
          cordova build android --release --no-telemetry -- --packageType=apk
          --keystore=release.jks
          --storePassword=${{ env.STOREPASS }}
          --alias=${{ env.KEYALIAS }}
          --password=${{ env.KEYPASS }}

      - name: Collect APK (+ keystore if generated)
        run: |
          set -e
          mkdir -p out
          APK_PATH="$(find platforms/android -type f -name "*release*.apk" | head -n 1)"
          if [ -z "$APK_PATH" ]; then echo "ERROR: no release APK found"; exit 1; fi
          cp "$APK_PATH" out/ArseniyGod-release.apk
          if [ "${{ env.GENERATED_KEYSTORE }}" = "1" ]; then cp release.jks out/GENERATED-release.jks; fi
          ls -la out

      - uses: actions/upload-artifact@v4
        with:
          name: ArseniyGod-release-APK
          path: out/
